name: Prototype checks
on:
  push:
  pull_request:
jobs:
  cue-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q render.py tests
      - name: Verify full-song timeline and provenance
        run: python -m unittest discover -s tests -v
      - name: Validate CSV scene coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          manifest=json.loads(Path('sequence.json').read_text())
          with Path('source_cues.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert [r['scene_id'] for r in rows] == [s['id'] for s in manifest['scenes']]
          assert all('youtube.com/watch?v=cB1GNO95iog&t=' in r['timestamped_source_url'] for r in rows)
          print(f"Verified {len(rows)} source-linked scenes")
          PY
