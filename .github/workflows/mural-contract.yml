name: Lyric mural contract checks
on:
  push:
  pull_request:
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview asset toolkit only
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile Blender source and production scripts (does not execute bpy)
        run: python -m compileall -q production tests
      - name: Verify one-way camera, lyric mapping, and stitcher fixtures
        run: python -m unittest discover -s tests -v
